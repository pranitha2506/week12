apiVersion: apps/v1
kind: Deployment
metadata:
  name: week12-deployment
spec:
  replicas: 4
  selector:
    matchLabels:
      app: week12app
  template:
    metadata:
      labels:
        app: week12app
    spec:
      containers:
        - name: week12app
          image: pranithapadtham/week8:image1 # use your Docker Hub image
          ports:
            - containerPort: 5000
